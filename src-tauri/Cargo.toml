[package]
name = "gitpulse"
version = "1.0.1"
description = "Local Git repository scanner and real-time manager"
authors = ["GitPulse"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri-plugin-single-instance = "2"
tauri = { version = "2.12.1", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
git2 = "0.21"
jwalk = "0.9"
notify = "8.2"
chrono = { version = "0.4", features = ["serde"] }
open = "5"

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
strip = true
