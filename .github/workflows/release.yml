name: Release
on:
  push:
    tags: ["v*"]
jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: "--no-bundle"
          - os: macos-latest
            args: "--bundles dmg"
          - os: ubuntu-22.04
            args: "--bundles appimage"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci --no-audit --no-fund
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: tauri-apps/tauri-action@v1
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: GitPulse ${{ github.ref_name }}
          releaseBody: Automated GitPulse release.
          args: ${{ matrix.args }}
      - name: Upload portable exe
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp src-tauri/target/release/gitpulse.exe GitPulse_${{ github.ref_name }}_x64-portable.exe
          gh release upload ${{ github.ref_name }} GitPulse_${{ github.ref_name }}_x64-portable.exe --clobber
