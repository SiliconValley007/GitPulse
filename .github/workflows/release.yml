name: Release
on:
  push:
    tags: ["v*"]
jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: "--bundles dmg"
          - os: ubuntu-22.04
            args: "--bundles appimage"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci --no-audit --no-fund
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Build and publish portable Windows exe
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx tauri build --no-bundle
          cp src-tauri/target/release/gitpulse.exe "GitPulse_${{ github.ref_name }}_x64-portable.exe"
          ok=0
          for i in 1 2 3 4 5; do
            gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || gh release create "${{ github.ref_name }}" --title "GitPulse ${{ github.ref_name }}" --notes "Automated GitPulse release." || true
            if gh release upload "${{ github.ref_name }}" "GitPulse_${{ github.ref_name }}_x64-portable.exe" --clobber; then ok=1; break; fi
            sleep 20
          done
          test "$ok" = 1
      - uses: tauri-apps/tauri-action@v1
        if: matrix.os != 'windows-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: GitPulse ${{ github.ref_name }}
          releaseBody: Automated GitPulse release.
          args: ${{ matrix.args }}